name: 'ci'

on:
  push:
    branches:
      - master

jobs:
  build-check-test:
    runs-on: "ubuntu-22.04"
    env:
        RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config

      # generate types, required for frontend build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # tauri::generate_context! needs dist/ to exist at compile time
      - run: mkdir -p dist
      - run: cargo gen

      # build frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      # get extra test deps and run everything
      - run: npx playwright install --with-deps chromium

      - run: cargo test
      - run: npm run test
